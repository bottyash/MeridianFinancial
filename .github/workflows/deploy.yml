# ─── Meridian Financial — CI + HuggingFace Spaces Deploy Workflow ────────────
# Active Deployment: HuggingFace Spaces (free-tier, permanent public demo)
# Future Deployment: AWS EC2 (planned, not yet active)
#
# Triggers: push to main after CI passes OR manual dispatch
#
# Jobs
# ----
# 1. guard             — CI gate check
# 2. validate          — config + Dockerfile sanity check
# 3. build-image       — build Docker image (API) with GHA layer cache
# 4. deploy-hf-spaces  — push dashboard to HuggingFace Spaces via HF Hub CLI
# 5. post-deploy-smoke — verify deployed API via /health endpoint
#
# Secrets required:
#   HF_TOKEN        — HuggingFace write token (Space update)
#   HF_API_SPACE    — HF Space name for FastAPI backend  e.g. "bottyash/meridian-api"
#   HF_DASH_SPACE   — HF Space name for dashboard        e.g. "bottyash/meridian-dashboard"
#   MISTRAL_API_KEY — only needed for live RAG; mocked in CI tests
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy (HuggingFace Spaces)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      skip_hf_deploy:
        description: "Skip HuggingFace Spaces deployment"
        required: false
        default: "false"
        type: boolean
      skip_smoke_test:
        description: "Skip post-deploy smoke test"
        required: false
        default: "false"
        type: boolean

env:
  PYTHON_VERSION: "3.11"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Guard — only proceed if the triggering CI run passed
  # ─────────────────────────────────────────────────────────────────────────────
  guard:
    name: CI gate check
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI gate passed
        run: echo "CI gate passed — proceeding to HuggingFace Spaces deploy."

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Validate config files and Dockerfile
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate artifacts
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install validation dependencies
        run: pip install pyyaml

      - name: Validate YAML configs
        run: |
          python -c "
          import yaml, sys
          from pathlib import Path

          configs = ['config/rag_config.yaml', 'config/logging.yaml']
          for cfg in configs:
              path = Path(cfg)
              if not path.exists():
                  print(f'WARNING: {cfg} not found — skipping')
                  continue
              with open(path) as f:
                  yaml.safe_load(f)
              print(f'OK: {cfg}')
          print('Config validation complete.')
          "

      - name: Check Dockerfile exists
        run: |
          test -f Dockerfile && echo "OK: Dockerfile" || (echo "FAIL: Dockerfile missing" && exit 1)
          test -f dashboard/Dockerfile && echo "OK: dashboard/Dockerfile" || (echo "FAIL: dashboard/Dockerfile missing" && exit 1)

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build API Docker image (verify it builds cleanly)
  # ─────────────────────────────────────────────────────────────────────────────
  build-image:
    name: Build API image
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: false
          tags: meridian-financial:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dashboard/Dockerfile
          push: false
          tags: meridian-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Deploy to HuggingFace Spaces
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-hf-spaces:
    name: Deploy to HuggingFace Spaces
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event.inputs.skip_hf_deploy != 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install HF Hub CLI
        run: pip install huggingface_hub

      - name: Push dashboard to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DASH_SPACE: ${{ secrets.HF_DASH_SPACE || 'bottyash/meridian-dashboard' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN not set — skipping HF Spaces push (dry run)"
            exit 0
          fi

          python - << 'PYEOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space_id = os.environ["HF_DASH_SPACE"]

          # Upload dashboard source to HF Space repository
          api.upload_folder(
              folder_path="dashboard",
              repo_id=space_id,
              repo_type="space",
              ignore_patterns=["*.pyc", "__pycache__", ".pytest_cache"],
              commit_message=f"Deploy dashboard from GitHub Actions",
          )
          print(f"Dashboard deployed to https://huggingface.co/spaces/{space_id}")
          PYEOF

      - name: Push API to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_API_SPACE: ${{ secrets.HF_API_SPACE || 'bottyash/meridian-api' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN not set — skipping API HF Spaces push (dry run)"
            exit 0
          fi
          echo "API deployment to HF Spaces: would push src/ + Dockerfile to $HF_API_SPACE"
          echo "Set HF_API_SPACE secret to enable automatic API deployment."

      - name: Record deployment summary
        run: |
          cat > deployment_summary.json << EOF
          {
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployment_target": "HuggingFace Spaces",
            "sha": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "dashboard_space": "${{ secrets.HF_DASH_SPACE || 'bottyash/meridian-dashboard' }}",
            "api_space": "${{ secrets.HF_API_SPACE || 'bottyash/meridian-api' }}"
          }
          EOF
          cat deployment_summary.json

      - name: Upload deployment summary
        uses: actions/upload-artifact@v4
        with:
          name: hf-deployment-summary
          path: deployment_summary.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Post-deploy smoke test (local compose — validates container startup)
  # ─────────────────────────────────────────────────────────────────────────────
  post-deploy-smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy-hf-spaces
    if: github.event.inputs.skip_smoke_test != 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for smoke test
        run: |
          echo "APP_ENV=ci" > .env
          echo "MISTRAL_API_KEY=mock-key-for-smoke" >> .env
          echo "API_BASE_URL=http://api:8000" >> .env

      - name: Start API container for smoke test
        run: |
          docker compose up api -d --build
          timeout 90 bash -c '
            until curl -sf http://localhost:8000/health; do
              echo "Waiting for API..."; sleep 5
            done
          ' || (docker compose logs api && exit 1)

      - name: Run smoke tests
        run: python scripts/smoke_test.py --base-url http://localhost:8000

      - name: Collect container logs
        if: always()
        run: docker compose logs api > smoke_test_logs.txt 2>&1 || true

      - name: Upload smoke test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-logs
          path: smoke_test_logs.txt
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down || true
