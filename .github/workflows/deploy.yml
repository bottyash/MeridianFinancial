# ─── Meridian Financial — Deployment Workflow ────────────────────────────────
# Triggers: push to main after CI passes (uses workflow_run) OR manual dispatch
#
# Jobs
# ----
# 1. validate          — sanity check artifacts + config
# 2. build-and-push    — build Docker image and push to GHCR
# 3. deploy-compose    — deploy via Docker Compose on self-hosted runner
#                        (falls back to a dry-run plan if no runner available)
# 4. post-deploy-smoke — verify deployed service health
#
# Secrets required:
#   GHCR_TOKEN  (or GITHUB_TOKEN, which is auto-available)
#   DEPLOY_HOST — optional SSH host for remote compose deploy
#   DEPLOY_USER — SSH user for remote deploy
#   DEPLOY_KEY  — SSH private key for remote deploy
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
      skip_smoke_test:
        description: "Skip post-deploy smoke test"
        required: false
        default: "false"
        type: boolean

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/meridian-financial

# Only run deploy if the triggering CI run succeeded
jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Guard: only proceed if the CI workflow that triggered us passed
  # ─────────────────────────────────────────────────────────────────────────────
  guard:
    name: CI gate check
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI gate passed
        run: echo "CI gate passed — proceeding to deploy."

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Validate artifacts and configuration
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate artifacts
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install validation dependencies
        run: pip install pyyaml pydantic pydantic-settings python-dotenv

      - name: Validate config files
        run: |
          python -c "
          import yaml, sys
          from pathlib import Path

          configs = [
            'config/rag_config.yaml',
            'config/logging.yaml',
          ]
          for cfg in configs:
              path = Path(cfg)
              if not path.exists():
                  print(f'WARNING: {cfg} not found — skipping')
                  continue
              with open(path) as f:
                  yaml.safe_load(f)
              print(f'OK: {cfg}')

          print('Config validation complete.')
          "

      - name: Validate Dockerfile syntax
        run: |
          docker build --check . || echo "Docker check not available, skipping"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build and push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Deploy via Docker Compose
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-compose:
    name: Deploy (Docker Compose)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate deployment .env
        run: |
          cat > .env << 'EOF'
          APP_ENV=${{ github.event.inputs.environment || 'staging' }}
          APP_PORT=8000
          MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY || 'placeholder' }}
          EOF

      - name: Pull latest image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true

      - name: Deploy with Docker Compose (local compose test)
        run: |
          # Update compose to use the published image instead of building
          export COMPOSE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          docker compose up api --no-build -d 2>/dev/null || \
            docker compose up api -d

          # Wait for health (max 90 s)
          timeout 90 bash -c '
            until curl -sf http://localhost:8000/health > /dev/null; do
              echo "Waiting for API..."; sleep 5
            done
          ' && echo "API healthy!" || echo "API did not become healthy (non-blocking)"

      - name: Save deployment logs
        if: always()
        run: docker compose logs api > deploy_logs.txt 2>&1 || true

      - name: Upload deployment logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-logs-${{ github.event.inputs.environment || 'staging' }}
          path: deploy_logs.txt
          retention-days: 30

      - name: Record deployment summary
        run: |
          cat > deployment_summary.json << EOF
          {
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "environment": "${{ github.event.inputs.environment || 'staging' }}",
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
            "sha": "${{ github.sha }}",
            "actor": "${{ github.actor }}"
          }
          EOF
          cat deployment_summary.json

      - name: Upload deployment summary
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary
          path: deployment_summary.json
          retention-days: 30

      - name: Tear down local compose
        if: always()
        run: docker compose down || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Post-deploy smoke test
  # ─────────────────────────────────────────────────────────────────────────────
  post-deploy-smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy-compose
    if: >
      github.event.inputs.skip_smoke_test != 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install requests
        run: pip install requests

      - name: Generate deployment .env
        run: |
          echo "APP_ENV=staging" > .env
          echo "MISTRAL_API_KEY=mock-key-for-smoke" >> .env

      - name: Start service for smoke test
        run: |
          docker compose up api -d
          timeout 90 bash -c '
            until curl -sf http://localhost:8000/health; do
              echo "Waiting..."; sleep 5
            done
          ' || (docker compose logs api && exit 1)

      - name: Run smoke tests
        run: |
          python - << 'PYEOF'
          import requests
          import sys

          BASE = "http://localhost:8000"
          passed = []
          failed = []

          # ── /health ──────────────────────────────────────────────
          try:
              r = requests.get(f"{BASE}/health", timeout=10)
              assert r.status_code == 200
              assert r.json().get("status") == "ok"
              passed.append("/health")
          except Exception as e:
              failed.append(f"/health: {e}")

          # ── /metrics ─────────────────────────────────────────────
          try:
              r = requests.get(f"{BASE}/metrics", timeout=10)
              assert r.status_code == 200
              data = r.json()
              for key in ("total_requests", "uptime_seconds", "prediction_distribution"):
                  assert key in data, f"Missing key: {key}"
              passed.append("/metrics")
          except Exception as e:
              failed.append(f"/metrics: {e}")

          # ── /openapi.json ─────────────────────────────────────────
          try:
              r = requests.get(f"{BASE}/openapi.json", timeout=10)
              assert r.status_code == 200
              paths = r.json().get("paths", {})
              for endpoint in ("/health", "/predict", "/ask-complaints",
                               "/batch-score", "/customer-intel", "/metrics"):
                  assert endpoint in paths, f"Missing endpoint: {endpoint}"
              passed.append("/openapi.json (all endpoints)")
          except Exception as e:
              failed.append(f"/openapi.json: {e}")

          # ── Summary ──────────────────────────────────────────────
          print(f"\nSmoke test results: {len(passed)} passed, {len(failed)} failed")
          for p in passed:
              print(f"  PASS  {p}")
          for f_msg in failed:
              print(f"  FAIL  {f_msg}")

          if failed:
              sys.exit(1)
          PYEOF

      - name: Tear down
        if: always()
        run: docker compose down || true
